<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RTO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="page-shell">
      <section class="message-panel" aria-labelledby="page-title">
        <p class="eyebrow">Teams notification</p>
        <h1 id="page-title">RTO</h1>
        <p class="intro">Send today's return-to-office notice to Teams.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="notice notice-{{ category }}" role="status">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form class="rto-form" method="post">
          <button type="submit">RTO</button>
        </form>
      </section>
    </main>
  </body>
</html>
